name: 每日K线数据
# 2026-11-05：GitHub 定时触发首次未启动，推此注释强制重新注册 cron（逻辑无改动）

on:
  schedule:
    - cron: '40 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取K线并写入 data/klines.json
        run: python3 fetch_klines.py
      - name: 提交更新
        run: |
          git config user.name "kline-bot"
          git config user.email "kline-bot@users.noreply.github.com"
          git add data/klines.json
          git diff --cached --quiet || git commit -m "每日K线 $(date +%F)"
          git push
