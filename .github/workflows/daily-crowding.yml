name: 每日拥挤度附带表

on:
  schedule:
    # 每天 15:45 北京时间（A股收盘后），仅交易日；节假日无新数据时脚本保留旧文件
    - cron: '45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 计算拥挤度并写入 data/crowding.json
        run: python3 fetch_crowding.py
      - name: 提交更新
        run: |
          git config user.name "crowding-bot"
          git config user.email "crowding-bot@users.noreply.github.com"
          git add data/crowding.json
          git diff --cached --quiet || git commit -m "每日拥挤度 $(date +%F)"
          git push
